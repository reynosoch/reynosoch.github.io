services:
  - type: web
    name: reynoso-drop
    runtime: docker
    plan: free
    dockerfilePath: ./drop-relay/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DROP_ALLOWED_ORIGINS
        value: https://reynosoch.github.io
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8080"
